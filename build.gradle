plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    // ModDevGradle (MDG) replaces ForgeGradle 6 for NeoForge. It compiles against Minecraft
    // 1.21.1 using Mojang's official names -- the same names a production NeoForge mod jar
    // ships with, so local AE2/GuideME/JEI/Jade jars need no deobf/remap step any more
    // (this is why `fg.deobf` is not applicable on NeoForge).
    id 'net.neoforged.moddev' version '2.0.107'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 21 for 1.21.1. The toolchain is resolved via foojay (settings.gradle);
// the system JAVA_HOME is never changed.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

repositories {
    mavenCentral()
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

neoForge {
    // Pinned in gradle.properties (21.1.180). AE2 19.2.17 itself requires neoforge [21.1.169,).
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    // ---- Local "the jar players actually run" dependencies (libs/) ----
    // NeoForge 1.21 mod jars are compiled against Mojang official names, so they can be put on
    // the compile classpath as plain files. compileOnly is enough for `gradlew build`.
    //
    // AE2 19.2.17 -- the only hard dependency (part/menu/monitor APIs live here).
    compileOnly files("libs/appliedenergistics2-${ae2_version}.jar")
    runtimeOnly files("libs/appliedenergistics2-${ae2_version}.jar")
    // GuideME 21.1.17 -- mandatory prerequisite of AE2 19.x (guidebook runtime + page format).
    compileOnly files("libs/guideme-${guideme_version}.jar")
    runtimeOnly files("libs/guideme-${guideme_version}.jar")

    // Soft dependencies, stage 2 of the port (WUT integration / tooltip providers). Kept on the
    // compile classpath so a future plugin class compiles against exactly the jar players use.
    // Also on the runtime classpath so `gradlew runClient` boots a realistic test instance.
    //
    // ⚠️ AE2WTLib 19.x keeps its public API in a NESTED jar
    // (META-INF/jarjar/de.mari_023.ae2wtlib_api-<ver>.jar -- a separate `ae2wtlib_api` mod that
    // NeoForge unpacks at runtime). javac cannot see through that nesting, so the xmod classes
    // (de.mari_023.ae2wtlib.api.*) compile against an unpacked copy produced by the
    // `extractAe2wtlibApi` task below: compile classpath ONLY, because putting that jar on the
    // runtime classpath as well would load the API mod twice (duplicate mod id).
    compileOnly files("libs/ae2wtlib-${ae2wtlib_version}.jar")
    compileOnly files(layout.buildDirectory.dir("ae2wtlib-api/META-INF/jarjar/de.mari_023.ae2wtlib_api-${ae2wtlib_version}.jar"))
    runtimeOnly files("libs/ae2wtlib-${ae2wtlib_version}.jar")
    compileOnly files("libs/jei-1.21.1-neoforge-${jei_version}.jar")
    runtimeOnly files("libs/jei-1.21.1-neoforge-${jei_version}.jar")
    compileOnly files("libs/Jade-1.21.1-NeoForge-${jade_version}.jar")
    runtimeOnly files("libs/Jade-1.21.1-NeoForge-${jade_version}.jar")
    // AE2WTLib runtime prerequisites (curios is OPTIONAL in its neoforge.mods.toml, the other two
    // are only needed by AE2WTLib's own optional integrations, but present here so the dev client
    // matches what the test instance in D:\PCL runs).
    runtimeOnly files("libs/architectury-13.0.8-neoforge.jar")
    runtimeOnly files("libs/cloth-config-15.0.140-neoforge.jar")
    runtimeOnly files("libs/curios-neoforge-9.5.1+1.21.1.jar")
}

/**
 * Unpacks AE2WTLib's nested (jar-in-jar) API jar into build/ae2wtlib-api so javac can resolve
 * `de.mari_023.ae2wtlib.api.*`. The extracted file is a build output only: libs/*.jar remains the
 * single source of truth for the version actually shipped, and the API mod still comes from
 * AE2WTLib's own jar-in-jar at runtime.
 */
def extractAe2wtlibApi = tasks.register('extractAe2wtlibApi', Copy) {
    from(zipTree(file("libs/ae2wtlib-${ae2wtlib_version}.jar"))) {
        include "META-INF/jarjar/de.mari_023.ae2wtlib_api-${ae2wtlib_version}.jar"
    }
    into layout.buildDirectory.dir('ae2wtlib-api')
}

tasks.named('compileJava').configure {
    dependsOn extractAe2wtlibApi
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version: neo_version, neo_version_range: neo_version_range,
            loader_version_range: loader_version_range,
            ae2_version: ae2_version,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    // No reobfJar on NeoForge 1.21: mods are compiled directly against official names.
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
