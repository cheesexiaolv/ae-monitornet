# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This provides enough memory for the Minecraft decompilation process of ModDevGradle.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false

# --- MC 1.21.1 / NeoForge 21.1 (stage 1 of the 1.20.1 -> 1.21.1 port) ---
# The dev toolchain builds against the newest 21.1.x release (21.1.265 as of 2026-10-31) so the
# compiled surface covers what players actually run. The compatibility window a player is checked
# against is declared separately, in neoforge.mods.toml via ${neo_version_range}: [21.1.169,).
# 21.1.169 is AE2 19.2.17's own floor, so building on 21.1.265 does not raise the NeoForge version
# players need -- the 1.21.1 line stays usable on any 21.1.x (e.g. "BBB v3.04" runs 21.1.248).
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.265
neo_version_range=[21.1.169,)
loader_version_range=[1,)

mod_id=ae_monitornet
mod_name=AE MonitorNet
# Loader this branch targets (ModDevGradle does not read this key; kept as the single source of
# truth for scripts/CI and for humans reading the file).
mod_loader=neoforge
mod_license=LGPL-3.0
mod_version=1.3.0
mod_group_id=com.cheesexiaolv.monitornet
mod_authors=cheesexiaolv
mod_description=Throughput monitoring for Applied Energistics 2: ME throughput monitor parts with in-GUI configuration and unit switching, an advanced monitor with history graphs, and a storage monitor terminal whose per-target chart windows can be dragged around.

# --- Hard dependency: AE2 19.x (NeoForge 21.1 line), supplied as a local jar in libs/ ---
ae2_version=19.2.17
# GuideME is a mandatory prerequisite of AE2 19.x (also used for our own guidebook pages)
guideme_version=21.1.17
# Soft dependencies (stage 2 of this port; jars in libs/ so compile-time == the jar players run)
ae2wtlib_version=19.5.1
jei_version=19.39.0.369
jade_version=15.10.6

# Local network workaround (this machine's link to the mod mavens is flaky): fail fast and retry
# instead of hanging on a half-open socket.
org.gradle.internal.repository.max.tentatives=6
systemProp.org.gradle.internal.http.socketTimeout=30000
systemProp.org.gradle.internal.http.connectionTimeout=30000
